<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorias | El Buen Sabor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/public/css/style.css" />
    <link rel="stylesheet" href="/public/css/responsive.css" />
  </head>
  <body>
    <div class="bg-orb orb-left"></div>
    <div class="bg-orb orb-right"></div>

    <main class="container py-4 py-lg-5 position-relative" style="z-index: 1">
      <header class="glass-panel p-4 p-lg-5 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <p class="eyebrow mb-2">Menu digital</p>
            <h1 class="h2 mb-1" id="menu-title">Categorias</h1>
            <p class="text-muted mb-0" id="menu-subtitle">
              Elegi una categoria para ver todos sus productos.
            </p>
          </div>
          <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-premium">Inicio</a>
            <a href="/carrito" class="btn btn-premium">
              <i class="fa-solid fa-cart-shopping me-2"></i>Carrito
            </a>
          </div>
        </div>
      </header>

      <section id="categories-section" class="mb-4">
        <div id="categories-grid" class="row g-3 g-lg-4"></div>
      </section>

      <section id="featured-section" class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">Productos destacados</h2>
          <span class="text-muted small">Selección especial</span>
        </div>
        <div id="featured-grid" class="row g-3 g-lg-4"></div>
      </section>

      <section id="top-selling-section" class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">Más vendidos</h2>
          <span class="text-muted small">Favoritos del barrio</span>
        </div>
        <div id="top-selling-grid" class="row g-3 g-lg-4"></div>
      </section>

      <section id="catalog-tools" class="glass-panel p-3 p-lg-4 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-6">
            <label class="form-label" for="search-input">Buscador</label>
            <input id="search-input" class="form-control" type="search" placeholder="Buscar por nombre, ingredientes o categoria" />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="category-filter">Filtro por categoria</label>
            <select id="category-filter" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="col-12 col-md-2">
            <button id="reset-filters-btn" class="btn btn-outline-premium w-100" type="button">Limpiar</button>
          </div>
        </div>
      </section>

      <section id="products-section" class="d-none">
        <div id="products-grid" class="row g-3 g-lg-4"></div>
      </section>

      <section id="global-products-section" class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">Todo el menú</h2>
          <span id="products-counter" class="text-muted small"></span>
        </div>
        <div id="global-products-grid" class="row g-3 g-lg-4"></div>
      </section>

      <div id="catalog-loader" class="catalog-loader d-none">
        <div class="spinner-border text-danger" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <template id="category-card-template">
        <article class="col-12 col-sm-6 col-lg-4 col-xl-3">
          <a class="category-card" href="#">
            <div class="category-image-wrap">
              <img src="" alt="" class="category-image" loading="lazy" />
            </div>
            <div class="category-body">
              <h2 class="h6 mb-0 category-name"></h2>
              <span class="category-action">Ver productos</span>
            </div>
          </a>
        </article>
      </template>

      <template id="product-card-template">
        <article class="col-12 col-md-6 col-xl-4">
          <div class="product-card h-100">
            <div class="product-image-wrap">
              <img src="" alt="" class="product-image" loading="lazy" />
              <span class="product-price"></span>
              <span class="product-stock-badge d-none">AGOTADO</span>
            </div>
            <div class="p-3 p-lg-4 d-flex flex-column gap-2">
              <h3 class="h5 mb-0 product-name"></h3>
              <p class="small text-muted mb-1 product-description"></p>
              <p class="product-ingredients mb-1"></p>
              <p class="small text-danger mb-1 d-none product-unavailable-message">
                Este producto no esta disponible por el momento.
              </p>
              <div class="d-flex gap-2 mb-1">
                <span class="badge text-bg-dark product-sold"></span>
                <span class="badge text-bg-warning d-none product-featured">Destacado</span>
              </div>
              <label class="form-label mb-1" for="">Aclaraciones (opcional)</label>
              <textarea
                class="form-control product-note"
                rows="2"
                placeholder="Ej: sin mayonesa, bien cocida, extra queso"
              ></textarea>
              <button type="button" class="btn btn-premium mt-2 add-to-cart-btn">
                <i class="fa-solid fa-plus me-2"></i>Agregar al carrito
              </button>
            </div>
          </div>
        </article>
      </template>

      <div
        class="position-fixed bottom-0 end-0 p-3"
        style="z-index: 1090"
        aria-live="polite"
        aria-atomic="true"
      >
        <div id="cart-toast" class="toast align-items-center text-bg-dark border-0" role="status">
          <div class="d-flex">
            <div class="toast-body">Producto agregado al carrito</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>
      </div>

      <div class="modal fade" id="productInfoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content checkout-modal">
            <div class="modal-header border-0 pb-0">
              <h2 class="modal-title h5" id="product-modal-title">Detalle</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2">
              <p class="mb-2" id="product-modal-description"></p>
              <p class="small text-muted mb-0" id="product-modal-extra"></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app-helpers.js"></script>
    <script src="/public/js/categorias.js"></script>
  </body>
</html>
