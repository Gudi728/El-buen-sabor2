<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="El Buen Sabor: rotiseria premium con una experiencia moderna de pedidos."
		/>
		<title>El Buen Sabor | Rotiseria</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
			integrity="sha512-SnH5WK+bZxgPHs44uWix+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8U8E0wsfSxX7Iu5N4mGq3wYHfGJfQxg=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>

		<link rel="stylesheet" href="/public/css/style.css" />
		<link rel="stylesheet" href="/public/css/responsive.css" />
	</head>
	<body>
		<div id="splash-loader" class="splash-loader" aria-hidden="true">
			<div class="skeleton-shell">
				<div class="skeleton-logo shimmer"></div>
				<div class="skeleton-line shimmer"></div>
				<div class="skeleton-line short shimmer"></div>
				<div class="skeleton-actions">
					<div class="skeleton-pill shimmer"></div>
					<div class="skeleton-pill shimmer"></div>
				</div>
			</div>
		</div>

		<div class="bg-orb orb-left"></div>
		<div class="bg-orb orb-right"></div>

		<a id="settings-fab" href="/admin" class="settings-fab" aria-label="Abrir panel de administracion">
			<i class="fa-solid fa-gear"></i>
		</a>

		<main class="home-wrapper container-fluid px-3 px-md-4 px-lg-5">
			<section class="hero-card glass-panel row g-0 align-items-center overflow-hidden">
				<div class="col-12 col-lg-6 p-4 p-md-5">
					<p class="eyebrow reveal-item">Rotiseria</p>
					<h1 class="hero-title reveal-item">El Buen Sabor</h1>
					<p class="hero-subtitle reveal-item">
						Comida casera con estandar premium, sabores intensos y entregas rapidas.
					</p>

					<div class="store-status-panel reveal-item" id="store-status-panel">
						<p class="mb-1 fw-semibold" id="store-status-label">Estado del local</p>
						<p class="mb-1 small" id="store-schedule-text">Horario de atencion: --</p>
						<p class="mb-0 small d-none" id="store-closed-message"></p>
					</div>

					<div class="contact-group reveal-item" id="contact-group">
						<a
							class="contact-pill instagram"
							href="https://www.instagram.com/rotiseria_elbuensabor._"
							target="_blank"
							rel="noopener noreferrer"
						>
							<span class="icon-wrap"><i class="fa-brands fa-instagram"></i></span>
							<span class="text-wrap">
								<small>Instagram</small>
								<strong id="instagram-handle">rotiseria_elbuensabor._</strong>
							</span>
						</a>

						<a
							class="contact-pill whatsapp"
							href="https://wa.me/543533514960"
							target="_blank"
							rel="noopener noreferrer"
						>
							<span class="icon-wrap"><i class="fa-brands fa-whatsapp"></i></span>
							<span class="text-wrap">
								<small>Whatsapp</small>
								<strong id="whatsapp-number">3533-514960</strong>
							</span>
						</a>
					</div>

					<div class="cta-row reveal-item">
						<a href="/categoria" id="menu-button" class="btn btn-premium">
							Ver menu
							<i class="fa-solid fa-arrow-right ms-2"></i>
						</a>
						<a href="/carrito" class="btn btn-outline-premium">
							Ir al carrito
						</a>
						<a href="/admin" class="btn btn-admin">
							Administracion
							<i class="fa-solid fa-gear ms-2"></i>
						</a>
					</div>
				</div>

				<div class="col-12 col-lg-6 image-stage">
					<div class="logo-float reveal-item">
						<img
							src="/public/img/LOGO.jpeg"
							alt="Logo El Buen Sabor"
							class="brand-logo"
						/>
					</div>
					<div class="flavor-card glass-panel reveal-item">
						<p class="mb-1">Experiencia destacada</p>
						<h2 class="h5 mb-0">Sabores que llegan calientes y a tiempo</h2>
					</div>
				</div>
			</section>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="/public/js/firebase.js"></script>
		<script src="/public/js/home.js"></script>
	</body>
</html>
